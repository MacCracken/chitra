name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of
        # truth for the toolchain version — no version is hardcoded in this
        # YAML. Use the upstream installer so the versioned
        # ~/.cyrius/versions/<ver>/ layout matches how cyrius resolves the
        # pin (a hand-rolled flat copy into ~/.cyrius/{bin,lib} leaves the
        # pinned version unresolvable and breaks `cyrius deps` — see patra/
        # mabda CI).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          # B-10 (1.0.3): VALIDATE THE EXTRACTION, DO NOT TRUST IT. If the pin
          # line is ever reformatted, renamed or lost, this grep yields an EMPTY
          # string — and install.sh treats an empty CYRIUS_VERSION as "give me
          # the latest release". CI would then go green on a toolchain nobody
          # pinned, which is the precise failure the "the pin is the only source
          # of truth" rule exists to prevent.
          if ! printf '%s' "$CYRIUS_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: could not read a semver toolchain pin from cyrius.cyml [package].cyrius"
            echo "       got: '$CYRIUS_VERSION'"
            exit 1
          fi
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # `cyrius deps` reads cyrius.cyml: the 8 [deps].stdlib leaves
        # (string/fmt/alloc/io/str/syscalls/assert/bench) come from the
        # installed toolchain, and [deps.sankoch] (tag 2.8.7, the zlib profile
        # dist/sankoch-zlib.cyr — not the full stdlib sankoch) is cloned from
        # its repo and checked against the commit pin in cyrius.lock. The
        # result is the 26-file closure the lock records. chitra is
        # pure-Cyrius — no external C libs to fetch. Do NOT replace lib/ with
        # a symlink to a cyrius checkout (cross-repo writes).
        #
        # gate-10 (1.1.1): THE LOCK IS CHECKED HERE, NOT REWRITTEN. A plain
        # `cyrius deps` writes cyrius.lock to whatever it resolves, so a stale
        # hash, a lock missing a line, a re-pointed sankoch tag and a DELETED
        # lock (re-pinned to whatever the tag now names) all went green — and a
        # `--verify` afterwards checks lib/ against the lock that same run had
        # just written. `--locked` resolves the tags against the COMMITTED lock
        # and writes nothing; lib/ is still empty here, so it compares the lock
        # alone, and it must run BEFORE the resolve that populates lib/. The
        # committed-lock and unchanged-lock checks are the same property seen
        # from git, so a regression in `--locked` itself is not a silent pass.
        # No `--verify`: after a fresh resolve into an empty lib/ there is
        # nothing left for it to disagree with (it passed every case above).
        run: |
          rm -rf lib
          mkdir lib
          git ls-files --error-unmatch cyrius.lock > /dev/null || {
            echo "ERROR: cyrius.lock is not committed."; exit 1; }
          cyrius deps --locked
          cyrius deps
          git diff --exit-code -- cyrius.lock || {
            echo "ERROR: resolving rewrote cyrius.lock — commit the lock the tags resolve to."
            exit 1; }

      - name: Lint
        # Hard gate: a `warn` line fails CI, and so does lint's OWN non-zero
        # exit. gate-9 (1.1.1): lint exits 1 on a file it cannot compile, having
        # run NO checks ("lint checks were NOT run"), and this loop used to
        # discard that status (`|| true`) and grep only for `warn` — so a file
        # that does not even parse passed as lint-clean.
        # `--strict-deferrals` (gate-14, 1.1.1): an untracked deferral note
        # fails lint's own exit, which the status check above catches. It was
        # turned on only once every linted file had zero of them — the 13 that
        # cyrius 6.7.9 reported were reworded, not silenced with #skip-lint.
        run: |
          fail=0
          # Globs MUST match the Makefile's. They did not until 0.7.3:
          # fuzz/*.fcyr and tests/bcyr/*.bcyr were covered locally by
          # `make lint` and skipped here, so a harness could pass CI and fail
          # the developer's own gate.
          for f in src/*.cyr programs/*.cyr tests/tcyr/*.tcyr fuzz/*.fcyr tests/bcyr/*.bcyr; do
            [ -e "$f" ] || continue
            rc=0
            out=$(cyrius lint --strict-deferrals "$f" 2>&1) || rc=$?
            echo "$out"
            if [ $rc -ne 0 ]; then
              echo "lint: $f exited $rc — it was NOT linted"; fail=1
            fi
            if echo "$out" | grep -qE '^[[:space:]]*warn '; then
              echo "lint: warnings in $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings or lint failures present"; exit 1; }

      - name: Format check
        # cyrius 6.x's `cyrfmt <file> --check` reports formatting via the EXIT
        # CODE only (0 = clean, non-zero = needs fmt) — it no longer echoes the
        # formatted file to stdout. The file goes BEFORE the --check flag.
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr tests/tcyr/*.tcyr fuzz/*.fcyr tests/bcyr/*.bcyr; do
            [ -e "$f" ] || continue
            if ! cyrius fmt "$f" --check > /dev/null 2>&1; then
              echo "needs fmt: $f"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Vet
        run: cyrius vet programs/smoke.cyr

      - name: Verify dist bundle is in sync with src/
        # B-11 (1.0.3): BOTH artifacts, not just the bundle. `cyrius distlib`
        # also writes dist/chitra.deps, and `cyrius deps` treats that sidecar as
        # AUTHORITATIVE for every consumer — a stale leaf list is a bill every
        # downstream build pays and cannot decline (the 1.0.1 lesson). Diffing
        # only chitra.cyr let it drift green.
        run: |
          cyrius distlib
          stale=0
          if ! git diff --quiet dist/chitra.cyr; then
            echo "ERROR: dist/chitra.cyr is stale. Run 'cyrius distlib' and commit the result."
            git --no-pager diff dist/chitra.cyr | head -40
            stale=1
          fi
          if ! git diff --quiet dist/chitra.deps; then
            echo "ERROR: dist/chitra.deps is stale. Run 'cyrius distlib' and commit the result."
            git --no-pager diff dist/chitra.deps
            stale=1
          fi
          [ $stale -eq 0 ] || exit 1
          echo "dist/chitra.cyr and dist/chitra.deps match src/"

      - name: Check public surface
        # B-9 (1.0.3): THE FROZEN-SURFACE GATE RAN NOWHERE. CLAUDE.md and
        # public-surface.md both say it gates "every `make lint`" — and it does,
        # but CI re-implements the lint loop rather than calling `make lint`, so
        # the one machine that blesses a tag never ran it. At v1.0 an
        # unclassified new export is a compatibility promise made by accident.
        run: ./scripts/check-surface.sh

      - name: Build (link-check, DCE on)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build programs/smoke.cyr build/chitra_smoke
          echo "smoke: $(wc -c < build/chitra_smoke) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/chitra_smoke | grep -q "7f45 4c46"

      - name: Compile bench harness (not run)
        # gate-9 (1.1.1): tests/bcyr/chitra.bcyr was compiled by NO step, so
        # lint and fmt were its only gates — and lint passed a file it could
        # not compile. Benchmarks are still not RUN here (host-dependent
        # numbers); building the harness is what keeps `make bench` working.
        run: make bench-build

      - name: Test (CPU-only suite)
        run: |
          # Functionality-grouped domain suites under tests/tcyr/ — globbed
          # so new domain files are picked up automatically.
          for f in tests/tcyr/*.tcyr; do cyrius test "$f" || exit 1; done

      - name: Consumer shape (stdlib sankoch leaf)
        # 1.1.4: three of chitra's five consumers link the stdlib "sankoch" leaf —
        # the FULL bundle from their toolchain — not chitra's [deps.sankoch] zlib
        # profile, and closest-wins makes theirs the one that runs. This rebuilds
        # a temp copy in that shape on chitra's OWN pin and runs every suite. It
        # fails if the pinned toolchain's stdlib sankoch is below the 2.8.6 floor
        # the consumer docs promise: png.tcyr's png-3 cells feed streams only
        # >= 2.8.6 refuses. Proven: on a 6.7.9 pin (stdlib sankoch 2.8.3) it fails.
        run: make consumer-shape

      - name: Fuzz (adversarial input harnesses)
        # CLAUDE.md names `make test-all` (version-check + dist + test + fuzz)
        # as the pre-release gate, but through 0.7.2 no workflow ran `make
        # fuzz` — so the gate existed only on a developer's machine, and the
        # harnesses could rot without CI noticing.
        #
        # gate-16 (1.1.1): this step and `make fuzz` used to be two different
        # loops over two different harness sets (bare `cyrius fuzz` also walks
        # tests/). It now IS `make fuzz`, so there is one definition.
        # gate-2 (1.1.1): and that definition runs under `--poison` —
        # allocator redzones, exit 86 on an overwrite. Without it fuzzing sees
        # only crashes, and a small overflow into the next bump allocation does
        # not crash: four audit mutants passed plain fuzz and fail poisoned.
        #
        # Benchmarks stay OUT deliberately: their numbers are host- and
        # load-dependent, so gating correctness on them manufactures flakes.
        # That exclusion is a decision; this one was an oversight.
        run: make fuzz

      - name: Version check
        run: ./scripts/version-check.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        # Matches code lines only — rejects patterns in # comments.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ programs/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          scan "raw execve"  'syscall( *59'
          scan "raw fork"    'syscall( *57'
          scan "sys_system"  '\bsys_system\s*('
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        # Required docs hard-fail; the AGNOS-convention optional docs
        # (CONTRIBUTING / SECURITY / LICENSE) warn only so a young package
        # stays green until they land.
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING (required): $f"; MISSING=1; fi
          done
          for f in CONTRIBUTING.md SECURITY.md LICENSE; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  WARN (optional, not yet present): $f"; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION file: $VERSION"
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"
